parallelThinking:
  displayName: "批判性复核"
  enabled: true
  provider: anthropic
  role: worker
  selection:
    includeInParallel: true
    tags: [复核, 风险, 反例, 证据]
    intents: [风险评估, 方案复核, 反方意见]
    negativeHints: []
    priority: 50
  knowledge:
    sharedMode: auto
    sharedCollections: [通用知识]
    privatePaths: [knowledge/review]
  context:
    defaultMode: summary
  limits:
    firstTokenTimeoutMs: 30000
    totalTimeoutMs: 180000
