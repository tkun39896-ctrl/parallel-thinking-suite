parallelThinking:
  displayName: "技术可行性分析"
  enabled: true
  provider: openrouter
  role: worker
  selection:
    includeInParallel: true
    tags: [技术, 架构, 实现, API]
    intents: [技术方案, 可行性分析, 系统设计]
    negativeHints: [纯文案润色]
    priority: 60
  knowledge:
    sharedMode: auto
    sharedCollections: [通用知识]
    privatePaths: [knowledge/technology]
  context:
    defaultMode: summary
  limits:
    firstTokenTimeoutMs: 30000
    totalTimeoutMs: 180000
